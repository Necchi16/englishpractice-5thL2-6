<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>えいごではなそう！</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-blue-50 font-sans touch-manipulation">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    const MONSTERS = [
      { id: 1, name: "勇気のライオン", emoji: "🦁", color: "bg-orange-200" },
      { id: 2, name: "笑顔のドラゴン", emoji: "🐉", color: "bg-green-200" },
      { id: 3, name: "星の妖精", emoji: "🧚", color: "bg-yellow-200" },
      { id: 4, name: "幸運のユニコーン", emoji: "🦄", color: "bg-pink-200" },
      { id: 5, name: "知恵のフクロウ", emoji: "🦉", color: "bg-blue-200" },
      { id: 6, name: "元気なウサギ", emoji: "🐰", color: "bg-red-200" },
      { id: 7, name: "仲良しキツネ", emoji: "🦊", color: "bg-orange-300" },
      { id: 8, name: "のんびりパンダ", emoji: "🐼", color: "bg-gray-200" },
      { id: 9, name: "優しいコアラ", emoji: "🐨", color: "bg-gray-300" },
      { id: 10, name: "希望のトラ", emoji: "🐯", color: "bg-yellow-300" },
      { id: 11, name: "歌うカエル", emoji: "🐸", color: "bg-green-300" },
      { id: 12, name: "踊るペンギン", emoji: "🐧", color: "bg-blue-300" },
      { id: 13, name: "夢見るイルカ", emoji: "🐬", color: "bg-cyan-200" },
      { id: 14, name: "長寿のカメ", emoji: "🐢", color: "bg-green-400" },
      { id: 15, name: "幸せのテントウムシ", emoji: "🐞", color: "bg-red-300" },
      { id: 16, name: "輝くチョウ", emoji: "🦋", color: "bg-blue-400" },
      { id: 17, name: "ピヨピヨひよこ", emoji: "🐥", color: "bg-yellow-400" },
      { id: 18, name: "力強いT-レックス", emoji: "🦖", color: "bg-green-500" },
      { id: 19, name: "穏やかなブラキオサウルス", emoji: "🦕", color: "bg-blue-500" },
      { id: 20, name: "華麗なクジャク", emoji: "🦚", color: "bg-emerald-300" },
      { id: 21, name: "おしゃべりオウム", emoji: "🦜", color: "bg-red-400" },
      { id: 22, name: "優雅なハクチョウ", emoji: "🦢", color: "bg-gray-100" },
      { id: 23, name: "情熱のフラミンゴ", emoji: "🦩", color: "bg-pink-300" },
      { id: 24, name: "まじめなハリネズミ", emoji: "🦔", color: "bg-amber-200" },
      { id: 25, name: "遊び好きなラッコ", emoji: "🦦", color: "bg-orange-100" },
      { id: 26, name: "準備万端リス", emoji: "🐿️", color: "bg-amber-300" },
      { id: 27, name: "光る流れ星", emoji: "🌟", color: "bg-yellow-100" },
      { id: 28, name: "きらきら魔法", emoji: "✨", color: "bg-yellow-50" },
      { id: 29, name: "ぽかぽか太陽", emoji: "☀️", color: "bg-orange-50" },
      { id: 30, name: "ふんわり雲", emoji: "☁️", color: "bg-blue-50" }
    ];

    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const DATES = ["first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth", "ninth", "tenth",
      "eleventh", "twelfth", "thirteenth", "fourteenth", "fifteenth", "sixteenth", "seventeenth", "eighteenth", "nineteenth", "twentieth",
      "twenty-first", "twenty-second", "twenty-third", "twenty-fourth", "twenty-fifth", "twenty-sixth", "twenty-seventh", "twenty-eighth", "twenty-ninth", "thirtieth", "thirty-first"];

    const getOrdinal = (n) => {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    };

    // --- ミニゲームコンポーネント ---
    function MiniGame({ monsters, onFinish }) {
      const [timeLeft, setTimeLeft] = useState(10);
      const [coins, setCoins] = useState(0);
      
      const initialPositions = useMemo(() => {
        return monsters.map((m) => ({
          id: m.id,
          emoji: m.emoji,
          x: 50 + (Math.random() * 40 - 20),
          y: 50 + (Math.random() * 40 - 20)
        }));
      }, [monsters]);

      const [playerPositions, setPlayerPositions] = useState(initialPositions);
      const [coinPos, setCoinPos] = useState({x: Math.random() * 80 + 10, y: Math.random() * 80 + 10});
      
      const playersRef = useRef(initialPositions);
      const coinRef = useRef({x: coinPos.x, y: coinPos.y});
      const keysRef = useRef({ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false});
      const requestRef = useRef();
      const isFinished = useRef(false);

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (timeLeft === 0 && !isFinished.current) {
          isFinished.current = true;
          cancelAnimationFrame(requestRef.current);
          onFinish(coins);
        }
      }, [timeLeft, coins, onFinish]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (keysRef.current.hasOwnProperty(e.key)) {
            keysRef.current[e.key] = true;
            e.preventDefault();
          }
        };
        const handleKeyUp = (e) => {
          if (keysRef.current.hasOwnProperty(e.key)) {
            keysRef.current[e.key] = false;
            e.preventDefault();
          }
        };
        window.addEventListener('keydown', handleKeyDown, {passive: false});
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, []);

      useEffect(() => {
        const updateGame = () => {
          if (timeLeft <= 0) return;

          const speed = 1.2;
          let dx = 0;
          let dy = 0;

          if (keysRef.current.ArrowUp) dy -= speed;
          if (keysRef.current.ArrowDown) dy += speed;
          if (keysRef.current.ArrowLeft) dx -= speed;
          if (keysRef.current.ArrowRight) dx += speed;

          const newPositions = playersRef.current.map(p => {
            let px = p.x + dx;
            let py = p.y + dy;
            px = Math.max(5, Math.min(95, px));
            py = Math.max(5, Math.min(95, py));
            return { ...p, x: px, y: py };
          });

          playersRef.current = newPositions;
          setPlayerPositions(newPositions);

          const cx = coinRef.current.x;
          const cy = coinRef.current.y;
          const hit = newPositions.some(p => Math.hypot(p.x - cx, p.y - cy) < 10);
          
          if (hit) { 
            setCoins(c => c + 1);
            coinRef.current = {
              x: Math.random() * 80 + 10,
              y: Math.random() * 80 + 10
            };
            setCoinPos({...coinRef.current});
          }

          requestRef.current = requestAnimationFrame(updateGame);
        };
        requestRef.current = requestAnimationFrame(updateGame);
        return () => cancelAnimationFrame(requestRef.current);
      }, [timeLeft]);

      const handlePointer = (dir, isDown) => {
        keysRef.current[dir] = isDown;
      };

      return (
        <div className="min-h-screen bg-green-50 p-4 md:p-8 flex flex-col items-center justify-center">
          <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-4 md:p-8 border-4 border-green-200">
            <h2 className="text-2xl font-bold text-center text-green-700 mb-4">コインをあつめよう！</h2>
            <div className="flex justify-between items-center mb-4 px-2">
              <div className="text-2xl font-bold text-gray-700">⏳ {timeLeft}びょう</div>
              <div className="text-2xl font-bold text-yellow-500">🪙 {coins} コイン</div>
            </div>
            
            <div className="relative w-full h-80 bg-green-100 rounded-xl overflow-hidden border-2 border-green-300">
              {playerPositions.map((p, index) => (
                <div 
                  key={p.id + '-' + index}
                  className="absolute text-5xl transform -translate-x-1/2 -translate-y-1/2 drop-shadow-md z-10"
                  style={{ left: `${p.x}%`, top: `${p.y}%` }}
                >
                  {p.emoji}
                </div>
              ))}
              <div 
                className="absolute text-3xl transform -translate-x-1/2 -translate-y-1/2 drop-shadow-md animate-bounce"
                style={{ left: `${coinPos.x}%`, top: `${coinPos.y}%` }}
              >
                🪙
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2 w-48 mx-auto mt-6 touch-none">
              <div />
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowUp', true)}
                onPointerUp={() => handlePointer('ArrowUp', false)}
                onPointerLeave={() => handlePointer('ArrowUp', false)}
              >⬆️</button>
              <div />
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowLeft', true)}
                onPointerUp={() => handlePointer('ArrowLeft', false)}
                onPointerLeave={() => handlePointer('ArrowLeft', false)}
              >⬅️</button>
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowDown', true)}
                onPointerUp={() => handlePointer('ArrowDown', false)}
                onPointerLeave={() => handlePointer('ArrowDown', false)}
              >⬇️</button>
              <button 
                className="bg-gray-200 active:bg-gray-400 p-4 rounded-xl text-2xl shadow select-none flex items-center justify-center"
                onPointerDown={() => handlePointer('ArrowRight', true)}
                onPointerUp={() => handlePointer('ArrowRight', false)}
                onPointerLeave={() => handlePointer('ArrowRight', false)}
              >➡️</button>
            </div>
            
            <p className="text-center text-gray-500 mt-4 text-sm font-bold">じゅうじキーでも うごかせるよ</p>
          </div>
        </div>
      );
    }

    // --- メインアプリ ---
    function App() {
      const [step, setStep] = useState('HOME'); 
      const [playCount, setPlayCount] = useState(0);
      const [collections, setCollections] = useState([]);
      const [totalCoins, setTotalCoins] = useState(0);
      
      const [selectedMonth, setSelectedMonth] = useState(1);
      const [selectedDate, setSelectedDate] = useState(1);
      const [reason, setReason] = useState("");
      const [translatedReason, setTranslatedReason] = useState("");
      
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
      
      const [failCount, setFailCount] = useState(0);
      const [isListening, setIsListening] = useState(false);
      const [recognitionText, setRecognitionText] = useState("");
      const [feedbackMsg, setFeedbackMsg] = useState("");
      
      const [currentGachaMonster, setCurrentGachaMonster] = useState(null);
      const [isRolling, setIsRolling] = useState(false);
      const [rollEmoji, setRollEmoji] = useState("🎁");
      const [lastEarnedCoins, setLastEarnedCoins] = useState(0);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const synth = window.speechSynthesis;

      useEffect(() => {
        const savedCount = localStorage.getItem('englishAppPlayCount');
        if (savedCount) setPlayCount(parseInt(savedCount, 10));
        const savedCollections = localStorage.getItem('englishAppCollections');
        if (savedCollections) setCollections(JSON.parse(savedCollections));
        const savedCoins = localStorage.getItem('englishAppCoins');
        if (savedCoins) setTotalCoins(parseInt(savedCoins, 10));
      }, []);

      const saveData = (newCount, newCollections, newCoins) => {
        localStorage.setItem('englishAppPlayCount', newCount.toString());
        localStorage.setItem('englishAppCollections', JSON.stringify(newCollections));
        localStorage.setItem('englishAppCoins', newCoins.toString());
        setPlayCount(newCount);
        setCollections(newCollections);
        setTotalCoins(newCoins);
      };

      const speak = useCallback((text, rate = 0.9) => {
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        utterThis.lang = 'en-US';
        utterThis.rate = rate; 
        const voices = synth.getVoices();
        const englishVoice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Female')) || voices.find(v => v.lang.includes('en-US'));
        if (englishVoice) utterThis.voice = englishVoice;
        synth.speak(utterThis);
      }, [synth]);

      useEffect(() => {
        if (step === 'COM_ANSWER_DAY') {
          setTimeout(() => speak("My special day is October seventeenth."), 500);
        } else if (step === 'COM_ANSWER_WHY') {
          setTimeout(() => speak("It's the day I ate Famichiki for the first time!"), 500);
        }
      }, [step, speak]);

      // 翻訳API呼び出し（強制的に「It's ~」の形にする）
      const handleTranslate = async () => {
        setStep('TRANSLATING');
        try {
          const queryText = `その日は${reason}です。`;
          const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(queryText)}&langpair=ja|en`);
          const data = await response.json();
          let text = data.responseData.translatedText;
          if (text) {
            // 翻訳結果の先頭によく付く主語・動詞・過去形などを削除する
            text = text.replace(/^(because\s+)?(it is|it's|it was|that is|that's|that was|this is|this was|the day is|the day was|that day is|that day was)\s+/i, '').trim();
            text = text.replace(/^because\s+/i, '').trim();
            
            // 祝日や記念日などの固有名詞が大文字のまま残るように、
            // 一般的な冠詞や代名詞 (a, an, the, my など) が先頭の場合のみ小文字にする
            const firstWordMatch = text.match(/^[a-zA-Z]+/);
            if (firstWordMatch) {
              const firstWord = firstWordMatch[0].toLowerCase();
              const wordsToLower = ["a", "an", "the", "my", "our", "your", "his", "her", "their"];
              if (wordsToLower.includes(firstWord)) {
                text = text.charAt(0).toLowerCase() + text.slice(1);
              }
            }
            
            // 強制的に It's から始める
            text = `It's ${text}`;
            setTranslatedReason(text);
          } else {
            setTranslatedReason("It's a special day.");
          }
          setStep('SPEAK_MY_WHY');
        } catch (error) {
          console.error("Translation error:", error);
          setTranslatedReason("It's a special day.");
          setStep('SPEAK_MY_WHY');
        }
      };

      const prepareQuiz = () => {
        const q = [];
        while(q.length < 4) {
          const r = Math.floor(Math.random() * 12) + 1;
          if(!q.includes(r)) q.push(r);
        }
        setQuizQuestions(q);
        setCurrentQuizIndex(0);
        setStep('QUIZ_INTRO');
      };

      const startListening = (targetType) => {
        if (!SpeechRecognition) {
          alert("お使いのブラウザは音声入力に対応していません。スキップして進んでください。");
          setFailCount(5); 
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        setIsListening(true);
        setRecognitionText("きいています...");
        setFeedbackMsg("");

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.toLowerCase();
          setRecognitionText(transcript);
          checkPronunciation(transcript, targetType);
        };
        recognition.onerror = () => {
          setIsListening(false);
          setRecognitionText("うまくききとれませんでした。もういちどボタンをおしてね。");
          setFailCount(prev => prev + 1);
        };
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      const checkPronunciation = (transcript, targetType) => {
        let isCorrect = false;
        
        if (targetType === 'MY_DAY') {
          const monthEng = MONTHS[selectedMonth - 1].toLowerCase();
          const dateWord = DATES[selectedDate - 1].toLowerCase();
          isCorrect = transcript.includes(monthEng) && (transcript.includes(dateWord) || transcript.includes(selectedDate.toString()) || transcript.includes(getOrdinal(selectedDate).toLowerCase()));
        } 
        else if (targetType === 'MY_WHY') {
          isCorrect = transcript.trim().length >= 3; // 翻訳文なので緩めに判定
        }
        else if (targetType === 'ASK_DAY') {
          isCorrect = transcript.includes("when") && transcript.includes("special") && transcript.includes("day");
        }
        else if (targetType === 'ASK_WHY') {
          isCorrect = transcript.includes("why");
        }
        else if (targetType === 'QUIZ') {
          const monthWord = MONTHS[quizQuestions[currentQuizIndex] - 1].toLowerCase();
          isCorrect = transcript.includes(monthWord);
        }

        if (isCorrect) {
          setFeedbackMsg("Excellent! 👏");
          setTimeout(() => speak("Excellent!"), 500);
          setTimeout(() => proceedToNext(targetType), 2000);
        } else {
          setFeedbackMsg("おしい！もういちどチャレンジ！");
          setFailCount(prev => prev + 1);
        }
      };

      const proceedToNext = (fromType) => {
        setFailCount(0);
        setRecognitionText("");
        setFeedbackMsg("");
        
        if (fromType === 'MY_DAY') setStep('ASK_WHY');
        if (fromType === 'MY_WHY') setStep('ASK_COM_DAY');
        if (fromType === 'ASK_DAY') setStep('COM_ANSWER_DAY');
        if (fromType === 'ASK_WHY') setStep('COM_ANSWER_WHY');
        if (fromType === 'QUIZ') {
          if (currentQuizIndex + 1 < 4) {
            setCurrentQuizIndex(prev => prev + 1);
          } else {
            setStep('GACHA');
          }
        }
      };

      const rollGacha = () => {
        setIsRolling(true);
        const intervalId = setInterval(() => {
          setRollEmoji(MONSTERS[Math.floor(Math.random() * MONSTERS.length)].emoji);
        }, 100);

        const ownedIds = collections.map(c => c.id);
        const unowned = MONSTERS.filter(m => !ownedIds.includes(m.id));
        const newMonster = unowned.length > 0 ? unowned[Math.floor(Math.random() * unowned.length)] : MONSTERS[Math.floor(Math.random() * MONSTERS.length)];

        setTimeout(() => {
          clearInterval(intervalId);
          setIsRolling(false);
          setCurrentGachaMonster(newMonster);
          if (!ownedIds.includes(newMonster.id)) {
            saveData(playCount + 1, [...collections, newMonster], totalCoins);
          } else {
            saveData(playCount + 1, collections, totalCoins);
          }
        }, 2500);
      };

      const renderHeader = (title) => (
        <div className="bg-blue-500 text-white p-4 rounded-t-2xl flex items-center justify-center font-bold text-xl mb-4 shadow-md">
          {title}
        </div>
      );

      // --- 画面レンダリング ---

      if (step === 'HOME') {
        return (
          <div className="min-h-screen p-4 md:p-8 flex flex-col justify-center relative">
            <div className="absolute top-4 right-4 bg-yellow-400 text-yellow-900 font-bold px-6 py-2 rounded-full border-4 border-yellow-200 shadow-lg text-xl z-50">
              🪙 {totalCoins}
            </div>
            <div className="max-w-2xl w-full mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-blue-200">
              <div className="bg-gradient-to-r from-blue-400 to-indigo-500 p-8 text-center text-white">
                <h1 className="text-3xl md:text-4xl font-extrabold mb-4 drop-shadow-md">えいごで はなそう！</h1>
                <p className="text-lg bg-white/20 inline-block px-4 py-2 rounded-full font-medium">🎧 イヤホンを つけましょう 🎧</p>
              </div>
              <div className="p-8 text-center">
                <button 
                  onClick={() => { setStep('GREETING'); setTimeout(() => speak("Hello! When is your special day?"), 500); }}
                  className="bg-red-500 hover:bg-red-600 text-white text-2xl font-bold py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 mx-auto mb-8 flex items-center"
                >
                  <span className="mr-2 text-2xl">▶️</span> スタート！
                </button>

                <div className="bg-yellow-50 rounded-2xl p-6 border-2 border-yellow-200">
                  <h2 className="text-xl font-bold text-yellow-700 mb-4">⭐ あつめたモンスター ({collections.length}/30)</h2>
                  <div className="grid grid-cols-5 gap-2 md:gap-4">
                    {collections.map(m => (
                      <div key={m.id} className={`${m.color} p-2 rounded-xl text-center shadow-sm text-2xl relative group cursor-default`} title={m.name}>
                        {m.emoji}
                        <div className="absolute hidden group-hover:block bg-black text-white text-xs p-1 rounded -top-8 left-1/2 transform -translate-x-1/2 whitespace-nowrap z-10">{m.name}</div>
                      </div>
                    ))}
                    {Array.from({ length: 30 - collections.length }).map((_, i) => (
                      <div key={`empty-${i}`} className="bg-gray-100 p-2 rounded-xl text-center border-2 border-dashed border-gray-300 text-2xl opacity-50">❓</div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (step === 'GREETING') {
        return (
          <div className="min-h-screen bg-green-50 p-4 flex items-center justify-center">
            <div className="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-green-200 text-center">
              {renderHeader("コンピューターからの しつもん")}
              <div className="mb-8">
                <button onClick={() => speak("Hello! When is your special day?")} className="bg-blue-100 p-4 rounded-full text-blue-600 hover:bg-blue-200 mx-auto mb-4 text-4xl">🔊</button>
                <p className="text-2xl font-bold text-gray-700">"When is your special day?"</p>
                <p className="text-gray-500 mt-2">（あなたの とくべつな日は いつですか？）</p>

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
